<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d8c9aa" />
    <title>Make It in China</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #d8c9aa; color: #29231e; font-family: system-ui, sans-serif; }
      button, textarea { font: inherit; }
      canvas { display: block; touch-action: none; }
      .hint {
        position: fixed; left: .65rem; top: .65rem; z-index: 2;
        padding: .45rem .75rem; border-radius: 999px; color: #332c24;
        background: rgba(255,255,255,.78); font-size: .85rem; pointer-events: none;
      }
      #game-hud {
        position: fixed; right: .65rem; top: .65rem; z-index: 3; max-width: 12rem;
        padding: .45rem .6rem; border: 1px solid #3c3329; border-radius: .55rem;
        background: rgba(255,250,238,.9); font-size: .76rem; text-align: right;
      }
      #hud-objective { margin-top: .18rem; color: #65584b; }
      #wallet-toast {
        position: absolute; right: .25rem; top: 100%; color: #176c3a; font-weight: 800;
        opacity: 0; transform: translateY(.5rem); transition: .18s ease-out;
      }
      #wallet-toast.show { opacity: 1; transform: translateY(0); }
      #dialogue-bubble {
        position: fixed; z-index: 4; width: min(22rem, calc(100vw - 1rem));
        padding: .85rem .9rem .65rem; border: 2px solid #393027; border-radius: .8rem;
        background: #fffaf0; box-shadow: 0 .3rem 0 rgba(45,37,29,.2);
        transform: translate(-50%, -100%);
      }
      #dialogue-bubble.offscreen { visibility: hidden; }
      #dialogue-bubble::after {
        content: ""; position: absolute; left: 50%; top: 100%; border: .6rem solid transparent;
        border-top-color: #393027; transform: translateX(-50%);
      }
      .npc-name {
        position: absolute; left: .5rem; bottom: calc(100% + .35rem); padding: .2rem .5rem;
        border-radius: .35rem; background: #393027; color: white; font-size: .76rem; font-weight: 700;
      }
      #dialogue-line { font-size: 1.28rem; line-height: 1.8; }
      .word-tap {
        min-width: 1.65rem; min-height: 44px; padding: 0 .08rem; border: 0;
        background: transparent; color: inherit; cursor: pointer; touch-action: manipulation;
      }
      .word-tap.new-word { text-decoration: underline 2px #bf603f; text-underline-offset: .22rem; }
      #word-popup {
        margin: .2rem 0; padding: .35rem .5rem; border-radius: .4rem;
        background: #eee2c9; font-size: .9rem;
      }
      .replay-button { border: 0; background: transparent; color: #8b8175; font-size: .75rem; }
      #reply-options {
        position: fixed; left: 50%; bottom: max(.65rem, env(safe-area-inset-bottom)); z-index: 5;
        display: grid; gap: .45rem; width: min(28rem, calc(100vw - 1rem)); transform: translateX(-50%);
      }
      .reply-button {
        min-height: 48px; padding: .5rem .8rem; border: 2px solid #393027; border-radius: .65rem;
        background: #fffaf0; box-shadow: 0 .18rem 0 #393027; cursor: pointer; touch-action: manipulation;
      }
      .reply-button:active { box-shadow: none; transform: translateY(.18rem); }
      .reply-button span, .reply-button small { display: block; }
      .reply-button small { margin-top: .12rem; color: #75695e; }
      #notebook-button {
        position: fixed; right: .65rem; bottom: max(.65rem, env(safe-area-inset-bottom)); z-index: 6;
        min-width: 54px; min-height: 48px; border: 2px solid #393027; border-radius: 50%;
        background: #e9bd65; font-weight: 800; touch-action: manipulation;
      }
      #notebook-panel {
        position: fixed; inset: .5rem; left: auto; z-index: 10; width: min(25rem, calc(100vw - 1rem));
        padding: .8rem; overflow: auto; border: 2px solid #393027; border-radius: .8rem; background: #fffaf0;
      }
      #notebook-panel header { display: flex; align-items: center; justify-content: space-between; }
      #notebook-panel h2, #notebook-panel h3 { margin: .35rem 0; }
      #notebook-close { min-width: 44px; min-height: 44px; border: 0; background: transparent; font-size: 1.5rem; }
      #notebook-words { max-height: 50vh; overflow: auto; }
      .notebook-word { padding: .2rem 0; font-size: .82rem; }
      .state-known { color: #176c3a; } .state-shaky { color: #a15813; }
      #notebook-panel label { display: block; margin-top: .65rem; font-size: .78rem; font-weight: 700; }
      #save-string { width: 100%; resize: vertical; }
      .save-actions { display: flex; gap: .4rem; }
      .save-actions button { min-height: 44px; flex: 1; touch-action: manipulation; }
      #save-status { min-height: 1.2rem; font-size: .78rem; color: #65584b; }
      @media (max-width: 520px) {
        #dialogue-bubble { width: calc(100vw - 1rem); }
        #reply-options { padding-right: 4rem; }
        .hint { font-size: .7rem; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hint">Click or tap the street to walk</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
